<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crazy Beans</title>
<style>
  :root { --bg: #fff6e3; --ink: #2b2d42; --accent: #ff8a1c; --muted: #6b6d80; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1b1d2a; --ink: #f2f2f5; --muted: #a9abbd; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 56px 16px; }
  h1 { margin: 0 0 4px; font-size: 40px; color: var(--accent); }
  p.lead { margin: 0 0 32px; color: var(--muted); }
  h2 { font-size: 20px; margin: 0 0 8px; }
  ul { padding-left: 20px; }
  a { color: var(--accent); }
  footer { margin-top: 48px; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>Crazy Beans</h1>
  <p class="lead">Small, cheerful mobile games.</p>
  <h2>Games</h2>
  <ul>
    <li><a href="https://play.google.com/store/apps/details?id=com.crazybeans.squeezestreet">Squeeze Street</a> &middot; <a href="https://coderramy.github.io/squeezestreet-privacy/">Privacy policy</a></li>
  </ul>
  <footer>Contact: <a href="mailto:ramy.coder@gmail.com">ramy.coder@gmail.com</a></footer>
</main>
</body>
</html>
